name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_linux:
        description: Skip Linux client checks (shared Rust checks remain enabled)
        type: boolean
        required: false
        default: false
      revision:
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nsh-toolchain:
    name: Resolve the latest stable NSH
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          releases=https://github.com/longbridge/nsh/releases
          release="$(curl -fsSL --head --retry 3 -o /dev/null -w '%{url_effective}' "$releases/latest")"
          [[ "$release" == "$releases/tag/"?* ]]
          tag="${release#"$releases/tag/"}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  linux:
    needs: nsh-toolchain
    if: ${{ !cancelled() && !inputs.skip_linux }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - name: Install GTK Linux build dependencies
        if: hashFiles('linux/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libgtk-4-dev libxkbcommon-dev
      - name: Install NSH native runner build dependencies
        if: hashFiles('linux/nsh.json') != ''
        run: sudo apt-get install -y libwebkitgtk-6.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Check Justfile formatting
        run: just --fmt --check
      - name: Linux client checks and non-GUI tests
        if: hashFiles('linux/Cargo.toml') != ''
        run: just check-rust-linux
      - &setup-nsh
        name: Install verified NSH CLI
        if: hashFiles('linux/Cargo.toml') != '' && hashFiles('linux/nsh.json') != ''
        shell: bash
        env:
          NSH_TAG: ${{ needs.nsh-toolchain.outputs.tag }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset=nsh-linux-x86_64.tar.gz ;;
            Linux-ARM64) asset=nsh-linux-arm64.tar.gz ;;
            macOS-ARM64) asset=nsh-macos-arm64.tar.gz ;;
            macOS-X64)   asset=nsh-macos-x86_64.tar.gz ;;
            Windows-X64) asset=nsh-windows-x86_64.zip ;;
            *) echo "Unsupported NSH host: $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          tools_dir="$(mktemp -d)"
          cd "$tools_dir"
          url="https://github.com/longbridge/nsh/releases/download/${NSH_TAG:?}/$asset"
          curl -fsSL --retry 3 "$url" -o "$asset"
          curl -fsSL --retry 3 "$url.sha256" -o "$asset.sha256"
          digest="$(awk 'NR == 1 {print $1}' "$asset.sha256")"
          [[ "$digest" =~ ^[0-9a-fA-F]{64}$ ]]
          test "$(openssl dgst -sha256 "$asset" | awk '{print $NF}')" = "$digest"
          if [[ "$RUNNER_OS" == Windows ]]; then
            unzip -q "$asset"
            cygpath -w "$tools_dir/nsh/bin" >> "$GITHUB_PATH"
            printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' 'RUST_MIN_STACK=268435456' >> "$GITHUB_ENV"
            "$tools_dir/nsh/bin/nsh.exe" --version
          else
            tar -xzf "$asset"
            printf '%s\n' "$tools_dir/nsh/bin" >> "$GITHUB_PATH"
            "$tools_dir/nsh/bin/nsh" --version
          fi
      - &nsh-check
        name: Check NSH mixed source
        if: hashFiles('linux/Cargo.toml') != '' && hashFiles('linux/nsh.json') != ''
        run: just nsh-check
      - &nsh-package
        name: Build NSH native runner and package (no GUI)
        if: hashFiles('linux/Cargo.toml') != '' && hashFiles('linux/nsh.json') != ''
        run: just nsh-package
  nsh-compatibility:
    name: NSH compatibility (${{ matrix.os }})
    needs: nsh-toolchain
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - *setup-nsh
      - *nsh-check
      - *nsh-package
  shared-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, xcode-27, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - name: Check Justfile formatting
        run: just --fmt --check
      - name: Install shared Rust Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Shared Rust checks and non-GUI tests
        run: just check-rust-shared
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            arch: arm64
            target: aarch64-apple-darwin
          - os: xcode-27
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Report selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: extractions/setup-just@v4
      - name: macOS Rust checks and non-GUI tests
        run: just check-rust-macos
      - name: Generate Swift bindings and compile SwiftUI
        run: just build ${{ matrix.arch }} debug
        env:
          ARCH: ${{ matrix.arch }}
          CONFIGURATION: debug
          BUILD_ONLY: '1'
      - name: Swift and Rust integration tests
        if: matrix.arch == 'arm64'
        run: just test-macos
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Update authentication, scheduling and mirror tests (no GUI)
        run: dotnet run --project windows/Tests/BibCiTeX.UpdateTests.csproj
      - uses: extractions/setup-just@v4
      - name: Windows Rust checks and non-GUI tests
        run: just check-rust-windows
      - name: Generate C# bindings and compile WinUI
        shell: pwsh
        run: just build ${{ matrix.arch }} Debug
      - name: C# and Rust integration tests
        shell: pwsh
        run: just test-windows "${{ github.workspace }}/target/${{ matrix.target }}/debug/bibcitex_csharp.dll"
      - name: Verify WinUI publish resources
        shell: pwsh
        run: dotnet publish windows/BibCiTeX/BibCiTeX.csproj --no-restore -c Release -p:Platform=${{ matrix.arch }} -o target/publish-check
