name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_linux:
        description: Skip Linux client checks (shared Rust checks remain enabled)
        type: boolean
        required: false
        default: false
      revision:
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    if: ${{ !inputs.skip_linux }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - name: Install GTK Linux build dependencies
        if: hashFiles('linux/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libxkbcommon-dev
      - name: Check Justfile formatting
        run: just --fmt --check
      - name: Linux client checks and non-GUI tests
        if: hashFiles('linux/Cargo.toml') != ''
        run: just check-rust-linux
      - name: Install NSH CLI
        if: hashFiles('linux/Cargo.toml') != ''
        env:
          NSH_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
        run: |
          release="$(curl -fsS --retry 3 -o /dev/null -w '%{redirect_url}' https://github.com/longbridge/nsh/releases/latest)"
          cd "$RUNNER_TEMP"
          archive="nsh-linux-$NSH_ARCH.tar.gz"
          url="https://github.com/longbridge/nsh/releases/download/${release##*/}/$archive"
          curl -fsSL --retry 3 "$url" -o "$archive"
          curl -fsSL --retry 3 "$url.sha256" -o "$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xzf "$archive"
          printf '%s\n' "$RUNNER_TEMP/nsh/bin" >> "$GITHUB_PATH"
      - name: Build NSH Linux client bundle
        if: hashFiles('linux/Cargo.toml') != ''
        run: just build
  shared-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, xcode-27, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - name: Check Justfile formatting
        run: just --fmt --check
      - name: Install shared Rust Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Shared Rust checks and non-GUI tests
        run: just check-rust-shared
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            arch: arm64
            target: aarch64-apple-darwin
          - os: xcode-27
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Report selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: extractions/setup-just@v4
      - name: macOS Rust checks and non-GUI tests
        run: just check-rust-macos
      - name: Generate Swift bindings and compile SwiftUI
        run: just build ${{ matrix.arch }} debug
        env:
          ARCH: ${{ matrix.arch }}
          CONFIGURATION: debug
          BUILD_ONLY: '1'
      - name: Swift and Rust integration tests
        if: matrix.arch == 'arm64'
        run: just test-macos
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Update authentication, scheduling and mirror tests (no GUI)
        run: dotnet run --project windows/Tests/BibCiTeX.UpdateTests.csproj
      - uses: extractions/setup-just@v4
      - name: Windows Rust checks and non-GUI tests
        run: just check-rust-windows
      - name: Generate C# bindings and compile WinUI
        shell: pwsh
        run: just build ${{ matrix.arch }} Debug
      - name: C# and Rust integration tests
        shell: pwsh
        run: just test-windows "${{ github.workspace }}/target/${{ matrix.target }}/debug/bibcitex_csharp.dll"
      - name: Verify WinUI publish resources
        shell: pwsh
        run: dotnet publish windows/BibCiTeX/BibCiTeX.csproj --no-restore -c Release -p:Platform=${{ matrix.arch }} -o target/publish-check
