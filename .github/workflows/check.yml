name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Release metadata regression tests
        run: python3 -m unittest discover -s ci -p 'test_*.py'
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            arch: arm64
            target: aarch64-apple-darwin
          - os: xcode-27
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Report selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Generate Swift bindings and compile SwiftUI
        run: bash macos/build.sh
        env:
          ARCH: ${{ matrix.arch }}
          CONFIGURATION: debug
          BUILD_ONLY: '1'
      - name: Swift and Rust integration tests
        if: matrix.arch == 'arm64'
        run: python3 macos/BibCiTeX/Tests/run-interop-tests.py --products target/swift/${{ matrix.arch }}/apple/Products/Debug --rust-library target/${{ matrix.target }}/debug/libbibcitex_ffi.a
      - name: Helper state and keyboard regression tests
        run: python3 macos/BibCiTeX/Tests/run-regressions.py
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Generate C# bindings and compile WinUI
        shell: pwsh
        run: ./windows/scripts/build.ps1 -Architecture ${{ matrix.arch }} -Configuration Debug
      - name: C# and Rust integration tests
        shell: pwsh
        run: dotnet run --project windows/Tests/BibCiTeX.IntegrationTests.csproj -c Debug -- "${{ github.workspace }}/target/${{ matrix.target }}/debug/bibcitex_csharp.dll"
