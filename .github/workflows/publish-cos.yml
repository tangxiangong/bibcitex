name: Publish existing release to COS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to mirror without rebuilding
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-feeds
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Download existing GitHub artifacts and publish to COS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ASSETS: release-assets
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          BIBCITEX_LINUX_UPDATE_PUBLIC_KEY: ${{ vars.BIBCITEX_LINUX_UPDATE_PUBLIC_KEY }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then error("Release is a draft") else . end'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RELEASE_ASSETS"
          cargo run --locked -p xtask -- publish-cos
