name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH[-alpha.N|-beta.N] tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-feeds
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.metadata.outputs.revision }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      linux: ${{ steps.metadata.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          cargo run --locked -p xtask -- release-metadata
          if test -f linux/Cargo.toml; then echo 'linux=true' >> "$GITHUB_OUTPUT"; else echo 'linux=false' >> "$GITHUB_OUTPUT"; fi
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require bilingual release notes
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          test -s "release-notes/$VERSION/zh-Hans.md"
          test -s "release-notes/$VERSION/en.md"
  checks:
    needs: prepare
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
  macos:
    needs: [prepare, checks]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build DMG, APP archive and signed Sparkle metadata
        run: bash ci/release-macos.sh
        env:
          ARCH: ${{ matrix.arch }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          BIBCITEX_LINUX_UPDATE_PUBLIC_KEY: ${{ vars.BIBCITEX_LINUX_UPDATE_PUBLIC_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/macos-${{ matrix.arch }}/*
          if-no-files-found: error
  windows:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            artifact_arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: ARM64
            artifact_arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build EXE, MSI and Velopack update packages
        shell: pwsh
        run: ./ci/release-windows.ps1
        env:
          ARCH: ${{ matrix.arch }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/windows-${{ matrix.artifact_arch }}/*
          if-no-files-found: error
  linux:
    needs: [prepare, checks]
    if: needs.prepare.outputs.linux == 'true'
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev
      - name: Build Linux client and packages
        env:
          BIBCITEX_LINUX_UPDATE_PUBLIC_KEY: ${{ vars.BIBCITEX_LINUX_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$BIBCITEX_LINUX_UPDATE_PUBLIC_KEY"
          cargo build --locked --release -p bibcitex-linux
          cargo run --locked -p xtask -- package-linux target/release/bibcitex dist/release/linux-${{ matrix.arch }} ${{ matrix.arch }}
      - name: Sign Linux update metadata
        env:
          LINUX_UPDATE_PRIVATE_KEY: ${{ secrets.LINUX_UPDATE_PRIVATE_KEY }}
          BIBCITEX_LINUX_UPDATE_PUBLIC_KEY: ${{ vars.BIBCITEX_LINUX_UPDATE_PUBLIC_KEY }}
        run: cargo run --locked -p xtask -- sign-linux dist/release/linux-${{ matrix.arch }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/linux-${{ matrix.arch }}/*
          if-no-files-found: error
  publish:
    needs: [prepare, macos, windows, linux]
    if: always() && needs.prepare.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      # Use the selected workflow's tooling even when repairing an older tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify complete release, upload missing assets, then advance channel feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ASSETS: release-assets
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          BIBCITEX_LINUX_UPDATE_PUBLIC_KEY: ${{ vars.BIBCITEX_LINUX_UPDATE_PUBLIC_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_REVISION"
          cargo run --locked --manifest-path automation/Cargo.toml -p xtask -- release-notes "release-notes/$VERSION" release-assets
          cargo run --locked --manifest-path automation/Cargo.toml -p xtask -- publish-release
      - name: Publish verified artifacts and channel feeds to COS
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ASSETS: release-assets
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          BIBCITEX_LINUX_UPDATE_PUBLIC_KEY: ${{ vars.BIBCITEX_LINUX_UPDATE_PUBLIC_KEY }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: cargo run --locked --manifest-path automation/Cargo.toml -p xtask -- publish-cos
