name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vMAJOR.MINOR.PATCH tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-stable
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      windows_version: ${{ steps.metadata.outputs.windows_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          just ci-release-metadata
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  checks:
    needs: prepare
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ needs.prepare.outputs.tag }}
  macos:
    needs: [prepare, checks]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            arch: arm64
            target: aarch64-apple-darwin
          - os: xcode-27
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Report selected Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: extractions/setup-just@v4
      - name: Sign, notarize and generate Sparkle feed
        run: just ci-release-macos
        env:
          ARCH: ${{ matrix.arch }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ vars.CODE_SIGN_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/release/macos-${{ matrix.arch }}/*.zip
            dist/release/macos-${{ matrix.arch }}/appcast-*.xml
          if-no-files-found: error
  windows:
    needs: [prepare, checks]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: extractions/setup-just@v4
      - name: Sign MSIX and generate App Installer feed
        shell: pwsh
        run: just ci-release-windows
        env:
          ARCH: ${{ matrix.arch }}
          WINDOWS_VERSION: ${{ needs.prepare.outputs.windows_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: |
            dist/release/windows-*/*.msix
            dist/release/windows-*/*.appinstaller
          if-no-files-found: error
  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Publish complete release and advance stable feeds
        run: just ci-publish-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ASSETS: release-assets
