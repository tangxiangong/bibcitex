name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH[-alpha.N|-beta.N] tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-feeds
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cargo run --locked -p xtask -- release-metadata
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require bilingual release notes
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          test -s "release-notes/$VERSION/zh-Hans.md"
          test -s "release-notes/$VERSION/en.md"
  checks:
    needs: prepare
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ needs.prepare.outputs.tag }}
  macos:
    needs: [prepare, checks]
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build DMG, APP archive and signed Sparkle metadata
        run: bash ci/release-macos.sh
        env:
          ARCH: ${{ matrix.arch }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/macos-${{ matrix.arch }}/*
          if-no-files-found: error
  windows:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build EXE, MSI and Velopack update packages
        shell: pwsh
        run: ./ci/release-windows.ps1
        env:
          ARCH: ${{ matrix.arch }}
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/windows-*/*
          if-no-files-found: error
  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify complete release, publish, then advance channel feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ASSETS: release-assets
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp "release-notes/$VERSION/zh-Hans.md" release-assets/notes-zh-Hans.md
          cp "release-notes/$VERSION/en.md" release-assets/notes-en.md
          cargo run --locked -p xtask -- publish-release
