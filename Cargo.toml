[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.6.0"
authors = ["tangxiangong <tangxiangong@gmail.com>"]
edition = "2024"
description = "A BibTeX citation tool"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arboard = "3"
bibcitex-core = { path = "crates/bibcitex-core" }
biblatex = { version = "0.11", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
dirs = "6"
enigo = "0.6"
fs-err = "3"
image = "0.25"
once_cell = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
xpaste = { path = "crates/xpaste" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
